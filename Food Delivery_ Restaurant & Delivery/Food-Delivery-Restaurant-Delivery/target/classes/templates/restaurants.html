<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restorani</title>
</head>
<body>

<h1>Food Delivery</h1>

<a href="/restaurants">Restorani</a> |
<a href="/deliveries">Dostave</a>

<h2>Lista restorana</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Naziv</th>
        <th>Adresa</th>
        <th>Telefon</th>
        <th>Broj dostava</th>
        <th>Akcija</th>
    </tr>

    <tr th:each="r : ${restaurants}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.name}"></td>
        <td th:text="${r.address}"></td>
        <td th:text="${r.phone}"></td>
        <td th:text="${r.deliveries.size()}"></td>
        <td>
            <a th:href="@{/restaurants/action/{id}(id=${r.id})}">
                Dodaj dostavu
            </a>
        </td>
    </tr>
</table>

</body>
</html>
