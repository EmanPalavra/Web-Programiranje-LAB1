spring.application.name=food-delivery
spring.thymeleaf.cache=false
server.port=8080
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/food_delivery_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
