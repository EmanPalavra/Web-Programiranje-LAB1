<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dostave</title>
</head>
<body>

<h1>Food Delivery</h1>

<a href="/restaurants">Restorani</a> |
<a href="/deliveries">Dostave</a>

<h2>Lista dostava</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Kupac</th>
        <th>Adresa</th>
        <th>Status</th>
        <th>Restoran</th>
    </tr>

    <tr th:each="d : ${deliveries}">
        <td th:text="${d.id}"></td>
        <td th:text="${d.customer}"></td>
        <td th:text="${d.address}"></td>
        <td th:text="${d.status}"></td>
        <td th:text="${d.restaurant.name}"></td>
    </tr>
</table>

</body>
</html>
